<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" role="img" aria-labelledby="title desc">
  <title id="title">MD Monirujjaman — Full-Stack Engineer</title>
  <desc id="desc">A midnight blue technical illustration with electric blue orbit lines and a glowing MM monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d2140"/><stop offset="1" stop-color="#050b16"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#56c8ff"/><stop offset="1" stop-color="#2784ff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#2784ff" stop-opacity=".35"/><stop offset="1" stop-color="#2784ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#7dbaff" stroke-opacity=".1"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
  </defs>
  <rect width="900" height="1000" rx="36" fill="url(#bg)"/><rect width="900" height="1000" rx="36" fill="url(#grid)"/>
  <ellipse cx="455" cy="475" rx="360" ry="340" fill="url(#glow)" filter="url(#blur)"/>
  <g fill="none" stroke="url(#blue)"><ellipse cx="450" cy="480" rx="300" ry="155" stroke-opacity=".55" transform="rotate(-28 450 480)"/><ellipse cx="450" cy="480" rx="300" ry="155" stroke-opacity=".24" transform="rotate(28 450 480)"/><circle cx="450" cy="480" r="245" stroke-opacity=".18" stroke-dasharray="3 12"/></g>
  <circle cx="188" cy="373" r="8" fill="#56c8ff"/><circle cx="692" cy="582" r="7" fill="#2784ff"/><circle cx="563" cy="244" r="5" fill="#a8e5ff"/>
  <rect x="273" y="344" width="354" height="270" rx="38" fill="#081326" stroke="#56c8ff" stroke-opacity=".55" stroke-width="2"/>
  <text x="450" y="513" text-anchor="middle" fill="#edf6ff" font-family="Arial,sans-serif" font-size="120" font-weight="700" letter-spacing="-8">MM</text>
  <text x="450" y="710" text-anchor="middle" fill="#a3b6ce" font-family="monospace" font-size="18" letter-spacing="5">FULL-STACK ENGINEER</text>
  <text x="450" y="758" text-anchor="middle" fill="#56c8ff" font-family="monospace" font-size="15" letter-spacing="3">REACT · NODE · MONGODB</text>
  <text x="450" y="923" text-anchor="middle" fill="#7187a4" font-family="monospace" font-size="13">BUILDING FOR THE WEB</text>
</svg>
