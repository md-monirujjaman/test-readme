<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">Full-stack engineering principles</title><desc id="desc">Build useful, responsive and maintainable web products using React, Node.js, Express and MongoDB.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081326"/><stop offset="1" stop-color="#050B16"/></linearGradient><linearGradient id="accent"><stop stop-color="#56C8FF"/><stop offset="1" stop-color="#2784FF"/></linearGradient></defs><rect width="1200" height="320" rx="24" fill="url(#bg)"/><text x="48" y="58" fill="#56C8FF" font-family="monospace" font-size="15" letter-spacing="4">ENGINEERING PRINCIPLES</text><g font-family="Arial,sans-serif"><g transform="translate(48 105)"><rect width="250" height="150" rx="18" fill="#102443" stroke="#2784FF" stroke-opacity=".45"/><text x="24" y="58" fill="#EDF6FF" font-size="26">Design clearly</text><text x="24" y="98" fill="#A3B6CE" font-size="15">Start with useful flows</text></g><g transform="translate(325 105)"><rect width="250" height="150" rx="18" fill="#102443" stroke="#2784FF" stroke-opacity=".45"/><text x="24" y="58" fill="#EDF6FF" font-size="26">Build reliably</text><text x="24" y="98" fill="#A3B6CE" font-size="15">Keep systems maintainable</text></g><g transform="translate(602 105)"><rect width="250" height="150" rx="18" fill="#102443" stroke="#2784FF" stroke-opacity=".45"/><text x="24" y="58" fill="#EDF6FF" font-size="26">Improve speed</text><text x="24" y="98" fill="#A3B6CE" font-size="15">Refine every layer</text></g><g transform="translate(879 105)"><rect width="273" height="150" rx="18" fill="#102443" stroke="#2784FF" stroke-opacity=".45"/><text x="24" y="58" fill="#EDF6FF" font-size="26">Learn and ship</text><text x="24" y="98" fill="#A3B6CE" font-size="15">Make progress visible</text></g></g><path d="M48 282H1152" stroke="url(#accent)"/></svg>
